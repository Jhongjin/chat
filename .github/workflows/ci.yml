name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  mobile-checks:
    name: Mobile checks
    runs-on: ubuntu-latest
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Expo Doctor
        run: npx expo-doctor
